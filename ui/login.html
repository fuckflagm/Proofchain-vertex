<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ProofChain — Secure cryptographic attestation login for holders, issuers, and verifiers.">
  <title>Login — ProofChain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Midnight Indigo Palette */
      --indigo-deep:     #0c102e;
      --indigo-primary:  #141b47;
      --indigo-elevated: #1d255c;
      --indigo-accent:   #2b367d;
      --indigo-muted:    #49569b;
      --indigo-soft:     #e9ecf8;

      /* Cream Vanilla Palette */
      --vanilla-bright:  #ffffff;
      --vanilla-canvas:  #faf8f2;
      --vanilla-tint:    #f3ede0;
      --vanilla-border:  #dfd6c3;
      --vanilla-dark:    #b8ab8e;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      color: var(--indigo-deep);
      background-color: var(--vanilla-bright);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .split-container {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* ── Left Form Side ── */
    .form-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 64px;
      background: var(--vanilla-bright);
      min-width: 0;
      position: relative;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      display: grid;
      grid-template-columns: repeat(2, 9px);
      gap: 3px;
    }

    .brand-logo-icon span {
      width: 9px;
      height: 9px;
      background: var(--indigo-primary);
      border-radius: 2px;
    }

    .brand-name {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--indigo-primary);
      text-transform: uppercase;
    }

    .form-wrapper {
      max-width: 400px;
      width: 100%;
      margin: 48px auto;
    }

    .title-block {
      margin-bottom: 24px;
    }

    .title-block h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: var(--indigo-deep);
      margin-bottom: 6px;
    }

    .title-block p {
      font-size: 0.92rem;
      color: var(--indigo-muted);
    }

    /* Role Switcher Pill Bar */
    .role-pills {
      display: flex;
      background: var(--vanilla-tint);
      border: 1px solid var(--vanilla-border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }

    .role-pill {
      flex: 1;
      padding: 8px 10px;
      border: none;
      background: transparent;
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--indigo-muted);
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }

    .role-pill:hover:not(.active) {
      color: var(--indigo-primary);
      background: rgba(255, 255, 255, 0.6);
    }

    .role-pill.active {
      background: var(--indigo-primary);
      color: var(--vanilla-bright);
      box-shadow: 0 2px 6px rgba(20, 27, 71, 0.2);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--indigo-deep);
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font-size: 0.88rem;
      font-family: var(--font-sans);
      color: var(--indigo-deep);
      background: var(--vanilla-bright);
      border: 1.5px solid var(--vanilla-border);
      border-radius: 8px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-input::placeholder {
      color: var(--vanilla-dark);
      font-size: 0.85rem;
    }

    .form-input:focus {
      border-color: var(--indigo-accent);
      box-shadow: 0 0 0 3px rgba(43, 54, 125, 0.12);
    }

    .pw-container {
      position: relative;
    }

    .pw-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--indigo-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color var(--transition);
    }

    .pw-toggle-btn:hover {
      color: var(--indigo-primary);
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 22px;
      font-size: 0.82rem;
    }

    .remember-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      color: var(--indigo-deep);
    }

    .remember-opt input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--indigo-primary);
      cursor: pointer;
      border-radius: 4px;
    }

    .forgot-link {
      color: var(--indigo-accent);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-size: 0.82rem;
    }

    .forgot-link:hover {
      text-decoration: underline;
      color: var(--indigo-primary);
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      height: 44px;
      background: var(--indigo-primary);
      color: var(--vanilla-bright);
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition), transform 80ms ease, box-shadow var(--transition);
      box-shadow: 0 2px 8px rgba(20, 27, 71, 0.25);
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--indigo-elevated);
      box-shadow: 0 4px 14px rgba(20, 27, 71, 0.32);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Error and Status alerts */
    .alert-box {
      display: none;
      margin-bottom: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
    }

    .alert-box.show {
      display: block;
    }

    .alert-error {
      background: #fdf0ed;
      color: #9c2817;
      border: 1px solid #f5cfc7;
    }

    .alert-status {
      background: var(--vanilla-tint);
      color: var(--indigo-primary);
      border: 1px solid var(--vanilla-border);
      text-align: center;
      font-weight: 500;
    }

    .form-footer {
      text-align: center;
      font-size: 0.78rem;
      color: var(--indigo-muted);
      margin-top: 24px;
    }

    .form-footer a {
      color: var(--indigo-accent);
      font-weight: 600;
      text-decoration: none;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    .copyright-note {
      font-size: 0.72rem;
      color: var(--vanilla-dark);
      font-family: var(--font-mono);
    }

    /* ── Right Illustration Side ── */
    .illustration-pane {
      flex: 1.15;
      background: radial-gradient(circle at 65% 42%, #252f75 0%, #192158 55%, #0d1235 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 40px;
    }

    .illustration-slides-container {
      position: relative;
      width: 100%;
      max-width: 620px;
      height: 660px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .illustration-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 20px 40px rgba(10, 14, 40, 0.45));
      opacity: 0;
      transform: translateY(28px) scale(0.94);
      pointer-events: none;
      transition: opacity 450ms cubic-bezier(0.16, 1, 0.3, 1),
                  transform 450ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .illustration-slide.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .illustration-svg {
      width: 100%;
      height: 100%;
      max-height: 85vh;
    }

    /* Floating micro-animations */
    @keyframes floatWave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.85; }
    }

    .anim-float {
      animation: floatWave 4.5s ease-in-out infinite;
    }
    .anim-pulse {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    /* Responsive */
    @media (max-width: 960px) {
      .split-container {
        flex-direction: column;
      }
      .form-pane {
        padding: 32px 24px;
      }
      .illustration-pane {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="split-container">

    <!-- Left Form Pane -->
    <div class="form-pane">
      <header class="brand-header">
        <div class="brand-logo-icon" aria-hidden="true">
          <span></span><span></span>
          <span></span><span></span>
        </div>
        <span class="brand-name">ProofChain</span>
      </header>

      <main class="form-wrapper">
        <div class="title-block">
          <h1>Welcome</h1>
          <p>Please enter your details</p>
        </div>

        <!-- 3-Role Switcher Tabs -->
        <div class="role-pills" role="tablist" aria-label="Select role">
          <button type="button" class="role-pill active" id="tab-holder" role="tab" aria-selected="true">Holder</button>
          <button type="button" class="role-pill" id="tab-issuer" role="tab" aria-selected="false">Issuer</button>
          <button type="button" class="role-pill" id="tab-verifier" role="tab" aria-selected="false">Verifier</button>
        </div>

        <div id="errorBox" class="alert-box alert-error" role="alert" aria-live="assertive"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" id="identLabel" for="identInput">Email address</label>
            <input type="text" class="form-input" id="identInput" autocomplete="username" placeholder="name@company.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="pwInput">Passkey</label>
            <div class="pw-container">
              <input type="password" class="form-input" id="pwInput" autocomplete="current-password" placeholder="Enter passkey" style="padding-right: 68px;" required>
              <button type="button" class="pw-toggle-btn" id="pwToggle" aria-label="Show passkey">Show</button>
            </div>
          </div>

          <div class="options-row">
            <label class="remember-opt">
              <input type="checkbox" id="rememberChk" checked>
              <span>Remember for 30 days</span>
            </label>
            <button type="button" class="forgot-link" id="forgotBtn">Forgot passkey?</button>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Login</button>
          <div id="statusBox" class="alert-box alert-status" style="margin-top: 14px;" aria-live="polite"></div>
        </form>

        <div class="form-footer">
          Stateless inspection? <a href="verify.html">Open client verifier without account</a>
        </div>
      </main>

      <footer class="copyright-note">
        ProofChain &middot; Cryptographic Attestation Architecture
      </footer>
    </div>

    <!-- Right Graphic Illustration Pane with Role-Specific Slides -->
    <div class="illustration-pane" aria-hidden="true">
      <div class="illustration-slides-container">

        <!-- Slide 1: Holder (Document Attestation & Verification Avatar) -->
        <div class="illustration-slide active" id="slide-holder">
          <svg class="illustration-svg" viewBox="0 0 600 660" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="monitorGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#2c3a8e" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#141b47" stop-opacity="0"/>
              </radialGradient>
              <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a0f30" flood-opacity="0.5"/>

            </defs>

            <!-- Floating Line-Art Elements -->
            <g transform="translate(70, 70)" stroke="#fffef9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">

            <g transform="translate(470, 95)" opacity="0.45">

              <circle cx="20" cy="30" r="9"/>

            <g transform="translate(370, 148)" stroke="#fffef9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">

            <g transform="translate(450, 205)" stroke="#fffef9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">

            <g transform="translate(85, 275)" stroke="#fffef9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">

              <circle cx="20" cy="20" r="16" stroke="#fffef9" stroke-width="1.8" fill="none"/>
              <circle cx="20" cy="20" r="6" stroke="#fffef9" stroke-width="1.6" fill="none"/>
              <circle cx="48" cy="20" r="8" stroke="#fffef9" stroke-width="1.8" fill="none"/>
              <circle cx="68" cy="20" r="5" stroke="#fffef9" stroke-width="1.8" fill="none"/>

            <g stroke="#fffef9" stroke-width="1.4" opacity="0.35">

            <rect x="195" y="355" width="265" height="205" rx="22" fill="#080b22" stroke="#fffef9" stroke-width="2.4"/>
            <rect x="203" y="363" width="249" height="189" rx="16" fill="#0c102e"/>

            <!-- Monitor Stand & Base -->
            <path d="M 300 560 L 290 605 L 365 605 L 355 560 Z" fill="#fffef9" fill-opacity="0.35" stroke="#fffef9" stroke-width="1.6"/>

            <!-- Bottom Wave Lines -->

        </div>

        <!-- Slide 2: Issuer (Document Minting & Merkle Tree Anchoring) -->
        <div class="illustration-slide" id="slide-issuer">
          <svg class="illustration-svg" viewBox="0 0 600 660" fill="none" xmlns="http://www.w3.org/2000/svg">

  <script>
    (function () {
      'use strict';

      const ROLES = {
        holder: {
          identLabel: 'Email address',
          identPlaceholder: 'holder@proofchain.org or ID-XXXXX',
          target: 'holder-dashboard.html',
        },
        issuer: {
          identLabel: 'Operator ID / Service Email',
          identPlaceholder: 'operator@proofchain.org',
          target: 'issuer-dashboard.html',
        },
        verifier: {
          identLabel: 'Auditor Email / Organization',
          identPlaceholder: 'auditor@firm.org',
          target: 'verifier-mailbox.html',
        },
      };

      const tabs       = document.querySelectorAll('.role-pill');
      const identLabel = document.getElementById('identLabel');
      const identInput = document.getElementById('identInput');
      const pwInput    = document.getElementById('pwInput');
      const pwToggle   = document.getElementById('pwToggle');
      const submitBtn  = document.getElementById('submitBtn');
      const errorBox   = document.getElementById('errorBox');
      const statusBox  = document.getElementById('statusBox');
      const loginForm  = document.getElementById('loginForm');
      const rememberCk = document.getElementById('rememberChk');
      const forgotBtn  = document.getElementById('forgotBtn');

      let active = 'holder';

      function applyRole(role) {
        active = role;
        const c = ROLES[role];
        identLabel.textContent       = c.identLabel;
        identInput.placeholder       = c.identPlaceholder;
        errorBox.classList.remove('show');
        statusBox.classList.remove('show');
        identInput.value = '';
        pwInput.value    = '';

        // Switch role illustration slide with smooth transition animation
        document.querySelectorAll('.illustration-slide').forEach(slide => {
          slide.classList.remove('active');
        });
        const targetSlide = document.getElementById('slide-' + role);
        if (targetSlide) {
          targetSlide.classList.add('active');
        }
      }

      tabs.forEach(tab => {
        const role = tab.id.replace('tab-', '');
        tab.addEventListener('click', () => {
          tabs.forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          applyRole(role);
          identInput.focus();
        });
      });

      pwToggle.addEventListener('click', () => {
        const hide = pwInput.type === 'password';
        pwInput.type = hide ? 'text' : 'password';
        pwToggle.textContent = hide ? 'Hide' : 'Show';
        pwToggle.setAttribute('aria-label', hide ? 'Hide passkey' : 'Show passkey');
      });

      forgotBtn.addEventListener('click', () => {
        alert('Passkeys are cryptographically anchored. Please contact your ProofChain registry administrator or operator to re-issue credentials.');
      });

      loginForm.addEventListener('submit', e => {
        e.preventDefault();
        errorBox.classList.remove('show');

        const cfg   = ROLES[active];
        const ident = identInput.value.trim();
        const pw    = pwInput.value;

        if (!ident) {
          errorBox.textContent = cfg.identLabel + ' is required.';
          errorBox.classList.add('show');
          identInput.focus();
          return;
        }
        if (!pw) {
          errorBox.textContent = 'Passkey is required.';
          errorBox.classList.add('show');
          pwInput.focus();
          return;
        }

        submitBtn.disabled = true;
        statusBox.textContent = 'Verifying cryptographic passkey...';
        statusBox.classList.add('show');

        setTimeout(() => {
          const session = {
            role: active,
            identifier: ident,
            authenticated_at: new Date().toISOString(),
            session_id: Array.from(crypto.getRandomValues(new Uint8Array(6)))
                          .map(b => b.toString(16).padStart(2,'0')).join(''),
          };
          const store = rememberCk.checked ? localStorage : sessionStorage;
          store.setItem('proofchain_session', JSON.stringify(session));
          statusBox.textContent = 'Authenticated. Redirecting...';
          setTimeout(() => { window.location.href = cfg.target; }, 300);
        }, 220);
      });

      applyRole('holder');
    })();
  </script>
</body>
