services:
  - type: web
    name: proofchain-api
    runtime: python
    plan: free
    rootDir: proofchain2/proofchain
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
